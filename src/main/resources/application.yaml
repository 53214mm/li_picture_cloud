spring:
  application:
    name: li-picture-cloud
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
  datasource:
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:li_picture_cloud_data}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.mcp.client.common.autoconfigure.McpToolCallbackAutoConfiguration
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 50MB
  ai:
    dashscope:
      chat:
        options:
          model: qwen-max
    mcp:
      client:
        sse:
          connections:
            mxai-mcp-server:
              url: https://mcp.mxai.cn
              sse-endpoint: /sse
  # Redis 配置
  data:
    redis:
      database: 15
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 5000
      password: ${REDIS_PASSWORD:}
  session:
    store-type: redis
    timeout: 2592000          # 30天（秒）
    cookie:
      max-age: 2592000        # 同样30天，与timeout保持同步
server:
  port: 8124
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
  packages-to-scan:
    - com.li.lipicturecloud.controller
  paths-to-exclude:
    - /actuator/**

app:
  cors:
    # 本地开发放行所有来源；生产 profile 必须通过 CORS_ALLOWED_ORIGINS 显式提供白名单。
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
  companion:
    enabled: ${COMPANION_ENABLED:true}
    feeding-enabled: ${COMPANION_FEEDING_ENABLED:true}
    processing-timeout: ${COMPANION_PROCESSING_TIMEOUT:5m}
    nutrition-policy: ${COMPANION_NUTRITION_POLICY:METADATA_ONLY}
    vision-endpoint: ${COMPANION_VISION_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    vision-provider: ${COMPANION_VISION_PROVIDER:dashscope}
    vision-model: ${COMPANION_VISION_MODEL:qwen3.6-flash}
    vision-api-key: ${DASHSCOPE_API_KEY:}
    vision-timeout: ${COMPANION_VISION_TIMEOUT:20s}
    vision-max-bytes: ${COMPANION_VISION_MAX_BYTES:8MB}
    vision-daily-limit: ${COMPANION_VISION_DAILY_LIMIT:10}
  model:
    credential:
      # 32 字节主密钥（64 位十六进制或 Base64）；生产环境缺失时启动失败，本地/测试回退到固定开发密钥。
      master-key: ${MODEL_CREDENTIAL_MASTER_KEY:}
      endpoint-allowlist: ${MODEL_ENDPOINT_ALLOWLIST:api.deepseek.com,api.openai.com,api.anthropic.com,generativelanguage.googleapis.com,api.moonshot.cn,dashscope.aliyuncs.com,api.mistral.ai,open.bigmodel.cn,api.siliconflow.cn}
  collaboration:
    store: ${COLLABORATION_STORE:redis}
    state-ttl: ${COLLABORATION_STATE_TTL:24h}
    channel: ${COLLABORATION_CHANNEL:picture-cloud:collaboration:events}
    allowed-origins: ${COLLABORATION_ALLOWED_ORIGINS:http://localhost:5173}
