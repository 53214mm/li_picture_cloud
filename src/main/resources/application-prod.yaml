cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}

spring:
  config:
    activate:
      on-profile: prod
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
    qianfan:
      api-key: ${QIANFAN_API_KEY}
      Bearer: ${QIANFAN_BEARER_TOKEN}
  session:
    redis:
      namespace: ${SESSION_REDIS_NAMESPACE:lipicturecloud:session:v1}
    cookie:
      secure: ${SESSION_COOKIE_SECURE:true}
      http-only: true
      same-site: lax

mxai:
  api-key: ${MXAI_API_KEY}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    # 生产跨域白名单必须由部署者显式提供（逗号分隔）；缺失时启动失败，绝不回退到全放行。
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}
  companion:
    enabled: ${COMPANION_ENABLED:false}
    feeding-enabled: ${COMPANION_FEEDING_ENABLED:false}
    # 生产不允许视觉策略静默使用本地默认值；每项都必须由部署者明确确认。
    nutrition-policy: ${COMPANION_NUTRITION_POLICY}
    vision-endpoint: ${COMPANION_VISION_ENDPOINT}
    vision-provider: ${COMPANION_VISION_PROVIDER}
    vision-model: ${COMPANION_VISION_MODEL}
    vision-api-key: ${DASHSCOPE_API_KEY}
    vision-timeout: ${COMPANION_VISION_TIMEOUT}
    vision-max-bytes: ${COMPANION_VISION_MAX_BYTES}
    vision-daily-limit: ${COMPANION_VISION_DAILY_LIMIT}
  model:
    credential:
      # 生产凭据主密钥必须由部署者提供；缺失时启动失败，绝不回退到任何固定密钥。
      master-key: ${MODEL_CREDENTIAL_MASTER_KEY}
      endpoint-allowlist: ${MODEL_ENDPOINT_ALLOWLIST}
  collaboration:
    store: redis
    state-ttl: ${COLLABORATION_STATE_TTL:24h}
    channel: ${COLLABORATION_CHANNEL:picture-cloud:collaboration:events}
    allowed-origins: ${COLLABORATION_ALLOWED_ORIGINS}
