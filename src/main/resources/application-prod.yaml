spring:
  config:
    activate:
      on-profile: prod
  session:
    cookie:
      secure: true
      http-only: true
      same-site: lax

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  collaboration:
    store: redis
    state-ttl: ${COLLABORATION_STATE_TTL:24h}
    channel: ${COLLABORATION_CHANNEL:picture-cloud:collaboration:events}
    allowed-origins: ${COLLABORATION_ALLOWED_ORIGINS}
