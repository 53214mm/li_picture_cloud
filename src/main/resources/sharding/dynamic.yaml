databaseName: li_picture_cloud_dynamic

dataSources:
  primary:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://${MYSQL_HOST:-localhost}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-li_picture_cloud_data}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:-root}
    password: ${MYSQL_PASSWORD:-}

rules:
  - !SHARDING
    tables:
      picture:
        actualDataNodes: primary.picture_$->{0..3}
        tableStrategy:
          complex:
            shardingColumns: spaceId,userId
            shardingAlgorithmName: dynamic-picture
    shardingAlgorithms:
      dynamic-picture:
        type: CLASS_BASED
        props:
          strategy: COMPLEX
          algorithmClassName: com.li.lipicturecloud.sharding.DynamicPictureShardingAlgorithm

props:
  sql-show: false
