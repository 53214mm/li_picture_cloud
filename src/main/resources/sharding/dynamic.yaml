databaseName: li_picture_cloud_dynamic

dataSources:
  primary:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://${MYSQL_HOST:-localhost}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-li_picture_cloud_data}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:-root}
    password: ${MYSQL_PASSWORD:-}

rules:
  - !SHARDING
    tables:
      picture:
        actualDataNodes: primary.picture_$->{0..3}
        tableStrategy:
          complex:
            shardingColumns: spaceId,userId
            shardingAlgorithmName: dynamic-picture
    shardingAlgorithms:
      dynamic-picture:
        type: CLASS_BASED
        props:
          strategy: COMPLEX
          algorithmClassName: com.li.lipicturecloud.sharding.DynamicPictureShardingAlgorithm
  - !SINGLE
    tables:
      - primary.user
      - primary.space
      - primary.space_user
      - primary.companion
      - primary.companion_skill
      - primary.companion_feed_run
      - primary.companion_growth_record
      - primary.companion_vision_usage
      - primary.companion_mood
      - primary.companion_relationship
      - primary.companion_memory
      - primary.companion_chat_message
      - primary.companion_chat_usage
      - primary.companion_autonomy_contract
      - primary.companion_proposal
      - primary.companion_proposal_reaction
      - primary.model_connection
      - primary.credential_vault
      - primary.model_usage_record
      - primary.task_routing_rule
      - primary.model_capability_profile
      - primary.mcp_connection
      - primary.mcp_tool_whitelist
      - primary.platform_trial_ledger
    defaultDataSource: primary

props:
  sql-show: false
