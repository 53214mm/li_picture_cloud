name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test, package, and report backend coverage
        env:
          # Live smoke is an operator-only action; CI always uses the local HTTP stub.
          COMPANION_VISION_LIVE_TEST: "false"
        run: ./mvnw -B -Dspring.profiles.active=test verify

      - name: Test Redis collaboration integration
        run: ./mvnw -B -Dredis.integration.enabled=true -Dtest=RedisCollaborationStateStoreTest,RedisCollaborationEventBusTest test

      - name: Publish backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: target/site/jacoco
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: li-picture-cloud-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: li-picture-cloud-frontend/package-lock.json

      - name: Use npm 10
        run: npm install --global npm@10

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check bundle budget
        run: npm run check:bundle

      - name: Verify companion is absent by default
        run: test -z "$(find dist/assets -maxdepth 1 -name 'CompanionView-*.js' -print -quit)"

      - name: Build enabled companion variant
        env:
          VITE_COMPANION_ENABLED: "true"
        run: npm run build

      - name: Verify enabled companion lazy chunk
        run: test -n "$(find dist/assets -maxdepth 1 -name 'CompanionView-*.js' -print -quit)"

      - name: Check enabled companion bundle budget
        run: npm run check:bundle

  companion-e2e:
    name: Companion browser E2E
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: li-picture-cloud-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: li-picture-cloud-frontend/package-lock.json

      - name: Use npm 10
        run: npm install --global npm@10

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Run companion browser flow
        run: npm run test:e2e

      - name: Publish Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-playwright-report
          path: li-picture-cloud-frontend/playwright-report
          if-no-files-found: ignore
