name: ${COMPOSE_PROJECT_NAME:-lipicturecloud}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  mysql:
    image: mysql:8.0
    container_name: lipicturecloud-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-li_picture_cloud_data}
      MYSQL_USER: ${MYSQL_USERNAME:-lipicturecloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/user.sql:/docker-entrypoint-initdb.d/01-user.sql:ro
      - ./sql/picture.sql:/docker-entrypoint-initdb.d/02-picture.sql:ro
      - ./sql/space.sql:/docker-entrypoint-initdb.d/03-space.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 384m
    networks: [app]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: lipicturecloud-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory 48mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 96m
    networks: [app]
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: lipicturecloud-backend:local
    container_name: lipicturecloud-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-li_picture_cloud_data}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-lipicturecloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_REDIS_NAMESPACE: ${SESSION_REDIS_NAMESPACE:-lipicturecloud:session:v1}
      COLLABORATION_ALLOWED_ORIGINS: ${COLLABORATION_ALLOWED_ORIGINS:-http://82.156.66.244}
      COMPANION_ENABLED: ${COMPANION_ENABLED:-false}
      COMPANION_FEEDING_ENABLED: ${COMPANION_FEEDING_ENABLED:-false}
      COMPANION_PROCESSING_TIMEOUT: ${COMPANION_PROCESSING_TIMEOUT:-5m}
      COMPANION_NUTRITION_POLICY: ${COMPANION_NUTRITION_POLICY:?COMPANION_NUTRITION_POLICY is required}
      COMPANION_VISION_ENDPOINT: ${COMPANION_VISION_ENDPOINT:?COMPANION_VISION_ENDPOINT is required}
      COMPANION_VISION_PROVIDER: ${COMPANION_VISION_PROVIDER:?COMPANION_VISION_PROVIDER is required}
      COMPANION_VISION_MODEL: ${COMPANION_VISION_MODEL:?COMPANION_VISION_MODEL is required}
      COMPANION_VISION_DAILY_LIMIT: ${COMPANION_VISION_DAILY_LIMIT:?COMPANION_VISION_DAILY_LIMIT is required}
      COMPANION_VISION_TIMEOUT: ${COMPANION_VISION_TIMEOUT:?COMPANION_VISION_TIMEOUT is required}
      COMPANION_VISION_MAX_BYTES: ${COMPANION_VISION_MAX_BYTES:?COMPANION_VISION_MAX_BYTES is required}
      COS_HOST: ${COS_HOST:?COS_HOST is required}
      COS_BUCKET: ${COS_BUCKET:?COS_BUCKET is required}
      COS_REGION: ${COS_REGION:?COS_REGION is required}
      COS_SECRET_ID: ${COS_SECRET_ID:?COS_SECRET_ID is required}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?COS_SECRET_KEY is required}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      QIANFAN_API_KEY: ${QIANFAN_API_KEY:?QIANFAN_API_KEY is required}
      QIANFAN_BEARER_TOKEN: ${QIANFAN_BEARER_TOKEN:?QIANFAN_BEARER_TOKEN is required}
      MXAI_API_KEY: ${MXAI_API_KEY:?MXAI_API_KEY is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8124"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 640m
    networks: [app]
    logging: *default-logging

  web:
    build:
      context: ./li-picture-cloud-frontend
      dockerfile: Dockerfile
      args:
        VITE_COMPANION_ENABLED: ${VITE_COMPANION_ENABLED:-false}
    image: lipicturecloud-web:local
    container_name: lipicturecloud-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 32m
    networks: [app]
    logging: *default-logging

networks:
  app:
    name: lipicturecloud

volumes:
  mysql_data:
    name: lipicturecloud_mysql_data
  redis_data:
    name: lipicturecloud_redis_data
